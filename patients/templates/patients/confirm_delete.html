{% extends "base.html" %}
{% block title %}Удалить пациента{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-danger border-0 shadow-sm">
      <div class="card-header bg-danger text-white fw-semibold">
        <i class="bi bi-exclamation-triangle me-1"></i>Подтверждение удаления
      </div>
      <div class="card-body">
        <p>Вы уверены, что хотите удалить пациента <strong>{{ object }}</strong>?</p>
        <p class="text-muted small">Все связанные медицинские записи также будут удалены.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'patients:list' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-danger">Удалить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
