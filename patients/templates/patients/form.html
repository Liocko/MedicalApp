{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-semibold">{{ title }}</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold" for="{{ field.id_for_label }}">
              {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
            </label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors.as_text }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2 justify-content-end mt-4">
            <a href="{% url 'patients:list' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
