name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/liocko/medicalapp

jobs:
  # ── Шаг 1-2: Сборка образа с тегом commit SHA ──────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # нужно для push в GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # автоматически доступен

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # ── Шаг 3: Деплой — берёт готовый образ, не пересобирает ───────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        run: |
          echo "Image  : ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Command: IMAGE_TAG=${{ github.sha }} docker-compose up -d --scale web=2"
          echo "Release: ${{ github.sha }} → production @ $(date -u)"
