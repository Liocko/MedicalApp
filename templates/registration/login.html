<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — MedicalApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-5 col-lg-4">

      <div class="text-center mb-4">
        <i class="bi bi-heart-pulse-fill text-primary" style="font-size: 2.5rem;"></i>
        <h1 class="h4 mt-2 fw-bold">MedicalApp</h1>
        <p class="text-muted small">Система управления медицинскими данными</p>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 mb-4">Вход в систему</h2>

          {% if form.errors %}
          <div class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-circle me-1"></i>
            Неверный логин или пароль.
          </div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold" for="{{ form.username.id_for_label }}">Логин</label>
              <input type="text" name="username" id="{{ form.username.id_for_label }}"
                     class="form-control" autofocus autocomplete="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="{{ form.password.id_for_label }}">Пароль</label>
              <input type="password" name="password" id="{{ form.password.id_for_label }}"
                     class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i>Войти
            </button>
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
          </form>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1"><span class="px-2 text-muted small">или</span><hr class="flex-grow-1">
          </div>

          <a href="{% url 'social:begin' 'yandex-oauth2' %}" class="btn w-100 d-flex align-items-center justify-content-center gap-2"
             style="background-color: #FC3F1D; color: white;">
            <img src="https://yastatic.net/s3/home-static/_/Z/6/nfVezDRqofwQZ5e669DSK84Tw.svg"
                 width="20" height="20" alt="Яндекс">
            Войти через Яндекс
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
