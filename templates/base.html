<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedicalApp{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">
      <i class="bi bi-heart-pulse-fill me-1"></i>MedicalApp
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if '/patients' in request.path and '/doctors' not in request.path %}active{% endif %}"
             href="{% url 'patients:list' %}">
            <i class="bi bi-people me-1"></i>Пациенты
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/doctors' in request.path %}active{% endif %}"
             href="{% url 'patients:doctor_list' %}">
            <i class="bi bi-person-badge me-1"></i>Врачи
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/records' in request.path %}active{% endif %}"
             href="{% url 'records:list' %}">
            <i class="bi bi-file-medical me-1"></i>Записи
          </a>
        </li>
      </ul>

      {% if user.is_authenticated %}
      <div class="d-flex align-items-center ms-3 gap-2">
        <a href="{% url 'profile' %}" class="text-white-50 small text-decoration-none">
          <i class="bi bi-person-circle me-1"></i>{{ user.username }}
        </a>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
