services:

  # ── Балансировщик нагрузки ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  # ── Приложение (масштабируется через --scale web=N) ────────────────────
  web:
    build: .
    image: ghcr.io/liocko/medicalapp:${IMAGE_TAG:-dev}
    expose:
      - "8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # ── Redis: сессии + WebSocket channel layer ────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
